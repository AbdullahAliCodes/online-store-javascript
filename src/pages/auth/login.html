<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login</title>
  </head>

  <body>
    <header>
      <nav>
        <ol id="header-nav-items">
          <li>LOGO</li>
          <li>COMPANY NAME</li>
          <li>
            <button><a href="./login.html">LOGIN / SIGNUP</a></button>
          </li>
        </ol>
      </nav>
    </header>

    <main>
      <div class="sign-in-card">
        <div class="hero">
          <div class="hero-inner">
            <h2>Your go-to one stop shop for all things clothing</h2>
            <h3>Hurry up, Order now !</h3>
          </div>
        </div>
        <form>
          <img alt="Our Logo" />
          <h3>Login to your account</h3>
          <div class="socials">
            <button class="social-btn">
              <img alt="Google Logo" />
              <p><span class="extra-text">Login with</span> Google</p>
            </button>
            <button class="social-btn">
              <img alt="Facebook Logo" />
              <p><span class="extra-text">Login with</span> Facebook</p>
            </button>
          </div>
          <span class="or"></span>
          <input type="email" placeholder="Email" />
          <input type="password" placeholder="Password" />
          <button type="submit">Login</button>
        </form>
      </div>
    </main>
  </body>
</html>
