<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login</title>
  </head>

  <body>
    <header>
      <nav>
        <ol id="header-nav-items">
          <li>LOGO</li>
          <li>COMPANY NAME</li>
          <li>
            <button><a href="./login.html">LOGIN / SIGNUP</a></button>
          </li>
        </ol>
      </nav>
    </header>

    <main>
      <div class="sign-in-card">
        <div class="hero">
          <div class="hero-inner">
            <h2>Your go-to one stop shop for all things clothing</h2>
            <h3>Hurry up, Order now !</h3>
          </div>
        </div>
        <!-- SIGN UP FORM -->
        <form class="sign-up-form">
          <img alt="Our Logo" />
          <h3>Login to your account</h3>
          <div class="socials">
            <button class="social-btn">
              <img alt="Google Logo" />
              <p><span class="extra-text">Sign Up with</span> Google</p>
            </button>
            <button class="social-btn">
              <img alt="Facebook Logo" />
              <p><span class="extra-text">Sign Up with</span> Facebook</p>
            </button>
          </div>
          <span class="or"></span>
          <input type="email" placeholder="Email" name="email" />
          <input type="password" placeholder="Password" name="password" />
          <button type="submit">Sign Up</button>
          <p>Already have an account? <a href="" id="to-login">Login</a></p>
        </form>
        <!-- LOGIN FORM -->
        <form class="login-form">
          <img alt="Our Logo" />
          <h3>Login to your account</h3>
          <div class="socials">
            <button class="social-btn">
              <img alt="Google Logo" />
              <p><span class="extra-text">Login with</span> Google</p>
            </button>
            <button class="social-btn">
              <img alt="Facebook Logo" />
              <p><span class="extra-text">Login with</span> Facebook</p>
            </button>
          </div>
          <span class="or"></span>
          <input type="email" placeholder="Email" name="email" />
          <input type="password" placeholder="Password" name="password" />
          <button type="submit">Login</button>
          <p>First time? <a href="" id="to-signup"> Signup</a></p>
        </form>
      </div>
    </main>

    <footer>
      <ol class="nav-items">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./shop.html">Browse Products</a></li>
        <li><a href="./login.html">Login / Logout</a></li>
      </ol>
      <ol class="policy-items">
        <li>
          <a href="https://www.youtube.com/watch?v=xvFZjo5PgG0"
            >Private Policy</a
          >
        </li>
        <li>
          <a href="https://www.youtube.com/watch?v=xvFZjo5PgG0"
            >Terms and Conditions</a
          >
        </li>
      </ol>
    </footer>
  </body>
</html>
