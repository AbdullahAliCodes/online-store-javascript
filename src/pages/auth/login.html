<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login</title>
  </head>

  <body>
    <main>
      <!-- . -->
      <div class="main-container">
        <div class="sign-in-card">
          <div class="back-to-home-container">
            <img class="back-icon" alt="Back to home icon" />
            <button class="back-to-home-btn">Back to Home</button>
          </div>
          <div class="hero">
            <div class="hero-inner">
              <h2>Your go-to one stop shop for all things clothing</h2>
              <h3>Hurry up, Order now !</h3>
            </div>
          </div>

          <!-- SIGN UP FORM -->
          <form class="sign-up-form">
            <img alt="Our Logo" class="our-logo" />
            <h3>Sign up now!</h3>
            <div class="socials">
              <button class="social-btn">
                <img alt="Google Logo" />
                <p><span class="extra-text">Sign Up with</span> Google</p>
              </button>
              <button class="social-btn">
                <img alt="Facebook Logo" />
                <p><span class="extra-text">Sign Up with</span> Facebook</p>
              </button>
            </div>
            <span class="or"></span>
            <input type="email" placeholder="Email" name="email" />
            <input type="password" placeholder="Password" name="password" />
            <button type="submit">Sign Up</button>
            <p>Already have an account? <a href="" id="to-login">Login</a></p>
            <p class="error-message"></p>
          </form>

          <!-- LOGIN FORM -->
          <form class="login-form">
            <img alt="Our Logo" class="our-logo" />
            <h3>Login to your account</h3>
            <div class="socials">
              <button class="social-btn">
                <img alt="Google Logo" />
                <p><span class="extra-text">Login with</span> Google</p>
              </button>
              <button class="social-btn">
                <img alt="Facebook Logo" />
                <p><span class="extra-text">Login with</span> Facebook</p>
              </button>
            </div>
            <span class="or"></span>
            <input type="email" placeholder="Email" name="email" />
            <input type="password" placeholder="Password" name="password" />
            <button type="submit">Login</button>
            <p>First time? <a href="" id="to-signup"> Signup</a></p>
            <p class="error-message"></p>
          </form>
          <!-- . -->
        </div>
      </div>
    </main>
  </body>
</html>
